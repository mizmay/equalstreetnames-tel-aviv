name: Update data

on:
  schedule:
    - cron: '0 2 1 * *' 
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"
  pull_request:
    paths:
      - ".github/workflows/update-data.yml"
      - "config.php"
      - "data.csv"
      - "overpass/*"

jobs:
  update-data:
    uses: EqualStreetNames/equalstreetnames/.github/workflows/reusable-update-date.yml@master
    permissions:
      contents: write
    secrets: inherit
    with:
      city: israel/tel-aviv
